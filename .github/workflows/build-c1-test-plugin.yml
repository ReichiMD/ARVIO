name: Build C1 test plugin (patched ExampleProvider)

on:
  push:
    branches:
      - claude/cloudstream-plugin-fixes-30ce3z
    paths:
      - ".github/workflows/build-c1-test-plugin.yml"
  workflow_dispatch:

jobs:
  build-plugin:
    name: Build a real (non-stub) CloudStream test plugin
    runs-on: ubuntu-latest

    steps:
      - name: Checkout ARVIO (to commit the result into)
        uses: actions/checkout@v5
        with:
          path: arvio

      - name: Checkout recloudstream/testplugins template
        uses: actions/checkout@v5
        with:
          repository: recloudstream/testplugins
          path: testplugins

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      # recloudstream/TestPlugins' own ExampleProvider.search() is a bare stub
      # that unconditionally `return listOf()` — useless for testing whether R8
      # broke a *working* third-party plugin. This patch gives it a real,
      # deterministic search/load/loadLinks (one fixed result, playing a public
      # domain test video) using standard, non-R8-hardened CloudStream idioms —
      # same build pipeline and dependencies as any normal community plugin.
      - name: Patch ExampleProvider with a real (non-empty) search/load/loadLinks
        run: |
          cat > testplugins/ExampleProvider/src/main/kotlin/com/example/ExampleProvider.kt <<'KOTLIN_EOF'
          package com.example

          import com.lagradost.cloudstream3.LoadResponse
          import com.lagradost.cloudstream3.MainAPI
          import com.lagradost.cloudstream3.SearchResponse
          import com.lagradost.cloudstream3.SubtitleFile
          import com.lagradost.cloudstream3.TvType
          import com.lagradost.cloudstream3.newMovieLoadResponse
          import com.lagradost.cloudstream3.newMovieSearchResponse
          import com.lagradost.cloudstream3.utils.ExtractorLink
          import com.lagradost.cloudstream3.utils.newExtractorLink

          class ExampleProvider : MainAPI() {
              override var mainUrl = "https://example.com/"
              override var name = "Example provider"
              override val supportedTypes = setOf(TvType.Movie)
              override var lang = "en"
              override val hasMainPage = true

              override suspend fun search(query: String): List<SearchResponse> {
                  return listOf(
                      newMovieSearchResponse("R8 Test Movie", "r8-test-movie", TvType.Movie)
                  )
              }

              override suspend fun load(url: String): LoadResponse {
                  return newMovieLoadResponse("R8 Test Movie", url, TvType.Movie, url)
              }

              override suspend fun loadLinks(
                  data: String,
                  isCasting: Boolean,
                  subtitleCallback: (SubtitleFile) -> Unit,
                  callback: (ExtractorLink) -> Unit
              ): Boolean {
                  callback(
                      newExtractorLink(
                          name,
                          "R8 Test Stream",
                          "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4"
                      )
                  )
                  return true
              }
          }
          KOTLIN_EOF

      - name: Build plugin (.cs3)
        working-directory: testplugins
        run: |
          chmod +x gradlew
          ./gradlew make --no-daemon

      - name: Commit built .cs3 + manifest into the ARVIO branch
        run: |
          mkdir -p arvio/.github/c1-test-plugin
          find testplugins -name "*.cs3"
          cp testplugins/ExampleProvider/build/*.cs3 arvio/.github/c1-test-plugin/ExampleProvider.cs3
          cat > arvio/.github/c1-test-plugin/plugins.json <<'JSON_EOF'
          [
              {
                  "internalName": "ExampleProvider",
                  "name": "ExampleProvider (R8 test, patched)",
                  "description": "Patched TestPlugins ExampleProvider with a real search/load/loadLinks, for ARVIO C1 (R8) repro only. Plays a public domain test video, no real sources.",
                  "version": 1,
                  "apiVersion": 1,
                  "tvTypes": ["Movie"],
                  "status": 1,
                  "language": "en",
                  "authors": ["ARVIO C1 test build"],
                  "url": "https://raw.githubusercontent.com/ReichiMD/ARVIO/claude/cloudstream-plugin-fixes-30ce3z/.github/c1-test-plugin/ExampleProvider.cs3",
                  "repositoryUrl": "https://github.com/ReichiMD/ARVIO"
              }
          ]
          JSON_EOF
          cd arvio
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git add .github/c1-test-plugin
          git commit -m "chore(test-plugin): add patched ExampleProvider .cs3 for C1 repro" || exit 0
          git push
