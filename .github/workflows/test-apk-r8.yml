name: Test APK (CloudStream C1+C2+C3, R8)

on:
  push:
    branches:
      - claude/cloudstream-plugin-fixes-cftmod
  workflow_dispatch:

jobs:
  build-release-test-apk:
    name: Build sideload release test APK (R8 minified)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      # This build only needs real TMDB access (so there's a catalog to browse,
      # open a detail page, and actually invoke a scraper — that's what exercises
      # C1/C2/C3). Cloud sync / Trakt stay synthetic placeholder values (not real
      # secrets, not sourced from repository secrets) that merely satisfy the
      # format checks in validateReleaseCloudSecrets (app/build.gradle.kts) so the
      # release build type's Gradle task runs at all.
      - name: Prepare runtime configuration (real TMDB, fake cloud/Trakt)
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: |
          cp secrets.defaults.properties secrets.properties
          if [ -n "$TMDB_API_KEY" ]; then
            sed -i "s|^TMDB_API_KEY=.*|TMDB_API_KEY=$TMDB_API_KEY|" secrets.properties
          fi
          cat >> secrets.properties <<'EOF'
          APP_ANON_KEY=fake.test.only.placeholder.jwt.not.a.real.credential.padding
          SUPABASE_URL=https://fake-test-project.supabase.co
          TRAKT_CLIENT_ID=fake_test_only_placeholder_id
          TRAKT_CLIENT_SECRET=fake_test_only_placeholder_secret
          EOF

      - name: DIAGNOSTIC - inspect resolved NiceHttp version and Requests.class bytecode
        run: |
          ./gradlew :app:dependencies --configuration sideloadReleaseRuntimeClasspath --no-daemon 2>&1 | grep -B2 -A2 -i nicehttp || echo "no nicehttp lines found in dependency tree"
          echo "--- locating resolved NiceHttp jar(s) in Gradle cache ---"
          find ~/.gradle /root/.gradle -iname "*nicehttp*.jar" 2>/dev/null
          echo "--- javap on Requests.class from each found jar ---"
          for jar in $(find ~/.gradle /root/.gradle -iname "*nicehttp*.jar" 2>/dev/null); do
            echo "=== $jar ==="
            mkdir -p /tmp/nhinspect && rm -rf /tmp/nhinspect/* && cd /tmp/nhinspect
            unzip -o -q "$jar" "com/lagradost/nicehttp/Requests.class" 2>&1
            if [ -f com/lagradost/nicehttp/Requests.class ]; then
              javap -p com/lagradost/nicehttp/Requests.class | grep -i "get\|post"
            fi
            cd -
          done

      - name: Inject parallel-install suffix + fixed test signing into release build type
        run: |
          sed -i '/^        release {/a\
              applicationIdSuffix = ".cstest"' app/build.gradle.kts
          sed -i '/^    signingConfigs {/a\
              create("fixedTestRelease") {\
                  storeFile = rootProject.file(".github/test-signing/debug.keystore")\
                  storePassword = "android"\
                  keyAlias = "androiddebugkey"\
                  keyPassword = "android"\
              }' app/build.gradle.kts
          sed -i '0,/signingConfigs.getByName("debug")/s//signingConfigs.getByName("fixedTestRelease")/' app/build.gradle.kts
          sed -i "s/versionCode = [0-9]*/versionCode = $((310 + GITHUB_RUN_NUMBER))/" app/build.gradle.kts

      - name: Build sideload release APK (R8 minification active)
        run: ./gradlew assembleSideloadRelease --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: arvio-cloudstream-c1c2c3-test-apk
          path: app/build/outputs/apk/sideload/release/*.apk
          if-no-files-found: error
          retention-days: 7
