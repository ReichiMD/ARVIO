name: Test APK (CloudStream C1 R8 repro)

on:
  push:
    branches:
      - claude/cloudstream-plugin-fixes-30ce3z
  workflow_dispatch:

jobs:
  build-release-test-apk:
    name: Build sideload release test APK (R8 minified)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      # This build only needs real TMDB access (so there's a catalog to browse
      # and open a detail page from, which is what actually invokes a scraper).
      # Cloud sync / Trakt stay synthetic placeholder values (not real secrets,
      # not sourced from repository secrets) that merely satisfy the format
      # checks in validateReleaseCloudSecrets (app/build.gradle.kts) so the
      # release build type's Gradle task runs at all.
      - name: Prepare runtime configuration (real TMDB, fake cloud/Trakt)
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: |
          cp secrets.defaults.properties secrets.properties
          if [ -n "$TMDB_API_KEY" ]; then
            sed -i "s|^TMDB_API_KEY=.*|TMDB_API_KEY=$TMDB_API_KEY|" secrets.properties
          fi
          cat >> secrets.properties <<'EOF'
          APP_ANON_KEY=fake.test.only.placeholder.jwt.not.a.real.credential.padding
          SUPABASE_URL=https://fake-test-project.supabase.co
          TRAKT_CLIENT_ID=fake_test_only_placeholder_id
          TRAKT_CLIENT_SECRET=fake_test_only_placeholder_secret
          EOF

      - name: Inject parallel-install suffix + fixed test signing into release build type
        run: |
          # applicationIdSuffix is safe to insert right at the top of release {} —
          # nothing later in the block touches it. signingConfig is NOT safe there:
          # the block's own existing conditional assignment runs AFTER this point
          # and would silently overwrite ours, falling back to AGP's ephemeral
          # auto-generated debug key instead (still installable, just a different
          # signature every build — that's why the previous run "succeeded" but
          # didn't actually use our fixed key). So the signing config is defined at
          # the signingConfigs {} level instead, and the release block's existing
          # fallback (signingConfigs.getByName("debug"), first occurrence only —
          # the same string also appears in staging {}) is repointed at it.
          sed -i '/^        release {/a\
              applicationIdSuffix = ".r8"' app/build.gradle.kts
          sed -i '/^    signingConfigs {/a\
              create("fixedTestRelease") {\
                  storeFile = rootProject.file(".github/test-signing/debug.keystore")\
                  storePassword = "android"\
                  keyAlias = "androiddebugkey"\
                  keyPassword = "android"\
              }' app/build.gradle.kts
          sed -i '0,/signingConfigs.getByName("debug")/s//signingConfigs.getByName("fixedTestRelease")/' app/build.gradle.kts
          sed -i "s/versionCode = [0-9]*/versionCode = $((310 + GITHUB_RUN_NUMBER))/" app/build.gradle.kts

      - name: Build sideload release APK (R8 minification active)
        run: ./gradlew assembleSideloadRelease --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: arvio-cloudstream-c1-repro-apk
          path: app/build/outputs/apk/sideload/release/*.apk
          if-no-files-found: error
          retention-days: 7
