name: Test APK (CloudStream C1 R8 repro)

on:
  workflow_dispatch:

jobs:
  build-release-test-apk:
    name: Build sideload release test APK (R8 minified)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      # This build only needs to exercise R8 minification the same way a real
      # release build does — it doesn't need working cloud sync / Trakt / TMDB.
      # These are synthetic placeholder values (not real secrets, not sourced
      # from repository secrets) that merely satisfy the format checks in
      # validateReleaseCloudSecrets (app/build.gradle.kts) so the release
      # build type's Gradle task runs at all.
      - name: Prepare fake-but-valid runtime configuration (no real secrets)
        run: |
          cp secrets.defaults.properties secrets.properties
          cat >> secrets.properties <<'EOF'
          APP_ANON_KEY=fake.test.only.placeholder.jwt.not.a.real.credential.padding
          SUPABASE_URL=https://fake-test-project.supabase.co
          TRAKT_CLIENT_ID=fake_test_only_placeholder_id
          TRAKT_CLIENT_SECRET=fake_test_only_placeholder_secret
          EOF

      - name: Inject fixed test signing into release build type
        run: |
          sed -i '/^        release {/a\
              signingConfig = signingConfigs.create("fixedTestRelease") {\
                  storeFile = file(".github/test-signing/debug.keystore")\
                  storePassword = "android"\
                  keyAlias = "androiddebugkey"\
                  keyPassword = "android"\
              }' app/build.gradle.kts
          sed -i "s/versionCode = [0-9]*/versionCode = $((310 + GITHUB_RUN_NUMBER))/" app/build.gradle.kts

      - name: Build sideload release APK (R8 minification active)
        run: ./gradlew assembleSideloadRelease --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: arvio-cloudstream-c1-repro-apk
          path: app/build/outputs/apk/sideload/release/*.apk
          if-no-files-found: error
          retention-days: 7
