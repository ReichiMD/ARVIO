name: Test APK (forced subtitles + TV preview)

# Test-branch only. This workflow and the committed keystore must never reach a
# pull request against upstream - they exist so a Claude Code session can hand
# the user an installable build. `workflow_dispatch` returns 403 from such a
# session (the app token has no `actions: write`), so a push to this branch is
# the trigger.

on:
  push:
    branches:
      - claude/forced-test-apk
  workflow_dispatch:

jobs:
  build-test-apk:
    name: Build sideload staging test APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      # Without a real key the app is an empty browser, and this round has to be
      # tested on actual films with actual subtitle tracks.
      - name: Prepare runtime configuration
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: |
          cp secrets.defaults.properties secrets.properties
          if [ -n "$TMDB_API_KEY" ]; then
            sed -i "s|^TMDB_API_KEY=.*|TMDB_API_KEY=$TMDB_API_KEY|" secrets.properties
            echo "TMDB key injected"
          else
            echo "::error::TMDB_API_KEY secret is empty - this feature cannot be tested without it"
            exit 1
          fi

      # Sanity check: the TV preview must be in this build, and it must be the
      # kind that only fires when the user forces TV mode on a touch device.
      - name: Verify the TV preview patch is present
        run: |
          grep -q 'TvPreviewLetterbox' app/src/main/kotlin/com/arflix/tv/MainActivity.kt \
            || { echo "::error::TV preview letterbox missing"; exit 1; }
          grep -q 'deviceModeOverride == "tv" && hasTouchScreen' app/src/main/kotlin/com/arflix/tv/MainActivity.kt \
            || { echo "::error::TV preview guard missing or changed"; exit 1; }

      # The point of this round, checked before 20 minutes of R8 are spent on it.
      # Deliberately asks for each of the four parts separately: the setting has
      # to be stored, reach the cloud backup, be reachable on TV and on the
      # phone, and the audio language has to actually arrive in the ViewModel -
      # a build missing any one of them looks fine and tests nothing.
      - name: Verify the forced-subtitles work is really in this build
        run: |
          grep -q 'use_forced_subtitles' app/src/main/res/values/strings.xml \
            || { echo "::error::setting label missing"; exit 1; }
          grep -q 'useForcedSubtitlesKeyFor' app/src/main/kotlin/com/arflix/tv/data/repository/CloudSyncRepository.kt \
            || { echo "::error::cloud backup would drop the setting"; exit 1; }
          grep -q '45 -> viewModel.setUseForcedSubtitles' app/src/main/kotlin/com/arflix/tv/ui/screens/settings/SettingsScreen.kt \
            || { echo "::error::TV row not wired"; exit 1; }
          grep -q 'setUseForcedSubtitles(!uiState.useForcedSubtitles)' app/src/main/kotlin/com/arflix/tv/ui/screens/settings/SettingsScreen.kt \
            || { echo "::error::phone row not wired"; exit 1; }
          grep -q 'updatePlayerAudioLanguage' app/src/main/kotlin/com/arflix/tv/ui/screens/player/PlayerScreen.kt \
            || { echo "::error::audio language never reaches the ViewModel"; exit 1; }
          grep -q 'ForcedSubtitles.pick' app/src/main/kotlin/com/arflix/tv/ui/screens/player/PlayerViewModel.kt \
            || { echo "::error::selection rule not called"; exit 1; }
          echo "forced-subtitles patch verified: setting, cloud, TV row, phone row, audio feed, rule"

      - name: Compile and run unit tests
        run: |
          # A second run is the office rule for the known order-dependent flakes
          # (docs/34 5z): another ViewModel test can leave a coroutine on the Main
          # dispatcher. Nothing is silenced - the build still fails if it stays red.
          ./gradlew testSideloadDebugUnitTest --no-daemon \
            || ./gradlew testSideloadDebugUnitTest --no-daemon --rerun-tasks

      # The office wants the test count as a measured number, not a guess.
      # Gradle does not print one, so it is summed out of the JUnit XML.
      - name: Count the unit tests
        if: always()
        run: |
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          tests = failures = errors = skipped = 0
          for f in glob.glob("app/build/test-results/testSideloadDebugUnitTest/*.xml"):
              r = ET.parse(f).getroot()
              tests += int(r.get("tests", 0)); failures += int(r.get("failures", 0))
              errors += int(r.get("errors", 0)); skipped += int(r.get("skipped", 0))
          print(f"unit tests: {tests} | failures: {failures} | errors: {errors} | skipped: {skipped}")
          PY

      # The office rule is "detekt rule for rule unchanged", and the fork CI does
      # not run detekt at all - so the count is taken here. It never fails the
      # build: the comparison is the point, not a gate.
      - name: Count detekt findings rule by rule
        continue-on-error: true
        run: |
          ./gradlew detekt --no-daemon || true
          for report in app/build/reports/detekt/*.xml; do
            [ -f "$report" ] || continue
            echo "== $report"
            grep -o 'source="[^"]*"' "$report" | wc -l | sed 's/^/  findings: /'
            grep -o '<error[^>]*source="[^"]*"' "$report" \
              | sed -n 's/.*source="detekt\.\([^"]*\)".*/\1/p' | sort | uniq -c | sort -rn
          done

      - name: Give the staging build its own package, name and a fixed signature
        run: |
          # Kennung "forced" - the identifier of this theme (docs/10, AGENTS.md
          # rule 10). It steers all three places: package suffix, launcher name
          # and artifact name. It is a NEW identifier, so this build installs
          # BESIDE the other test APKs and starts empty: portal, MAC and
          # playlists have to be entered once.
          sed -i 's|<string name="app_name">ARVIO</string>|<string name="app_name">Forced-Untertitel</string>|' \
            app/src/main/res/values/strings.xml
          # staging differs from debug here: it already HAS an applicationIdSuffix
          # (".beta") to replace, where debug has a commented-out line to insert
          # after (docs/10, "Beim Wechsel der Sorte mitdenken").
          sed -i 's|applicationIdSuffix = ".beta"|applicationIdSuffix = ".forced"|' app/build.gradle.kts
          sed -i "s/versionCode = [0-9]*/versionCode = $((950000 + GITHUB_RUN_NUMBER))/" app/build.gradle.kts
          # A sed that silently matches nothing is how this kind of workflow wastes
          # a build cycle. The ".beta" check is the one that has actually bitten
          # before: a missed replacement does not fail anything, it just ships an
          # APK called ".beta" that installs BESIDE the intended one.
          grep -q '<string name="app_name">Forced-Untertitel</string>' app/src/main/res/values/strings.xml \
            || { echo "::error::app_name patch did not apply"; exit 1; }
          grep -q 'applicationIdSuffix = ".forced"' app/build.gradle.kts \
            || { echo "::error::suffix patch did not apply"; exit 1; }
          if grep -q 'applicationIdSuffix = ".beta"' app/build.gradle.kts; then
            echo "::error::a .beta suffix is still present - the APK would install beside the intended one"
            exit 1
          fi
          grep -q "versionCode = $((950000 + GITHUB_RUN_NUMBER))" app/build.gradle.kts \
            || { echo "::error::versionCode patch did not apply"; exit 1; }
          # staging inherits from release and with it the cloud-secret gate, which
          # demands production keys that exist only in the upstream repo. The gate
          # is there to stop such a build being PUBLISHED, not tested.
          sed -i 's|dependsOn(validateReleaseCloudSecrets)|// CI test build only: cloud-secret gate disabled|' app/build.gradle.kts
          grep -q 'CI test build only: cloud-secret gate disabled' app/build.gradle.kts \
            || { echo "::error::cloud-secret gate patch did not apply"; exit 1; }
          cat >> app/build.gradle.kts <<'KTS'

          // CI only: with no release keystore present, staging falls back to the
          // signing config named "debug", which on a runner points at a freshly
          // generated ~/.android/debug.keystore - every build would carry a
          // different signature and no test APK could replace the previous one.
          // Pin it to the committed keystore.
          android {
              signingConfigs {
                  getByName("debug") {
                      storeFile = rootProject.file(".github/test-signing/debug.keystore")
                      storePassword = "android"
                      keyAlias = "androiddebugkey"
                      keyPassword = "android"
                  }
              }
          }
          KTS

      # Mess-APK (docs/10), by explicit request: R8 and resource shrinking on, so
      # it runs on the TV like a real release instead of the noticeably sluggish
      # debug build. It also answers test case 12 - whether playback still starts
      # as fast with the setting on - which a debug build cannot answer honestly.
      - name: Build sideload staging APK
        run: ./gradlew assembleSideloadStaging --no-daemon

      - name: Verify APK signature against the committed keystore
        run: |
          EXPECTED=$(keytool -list -v -keystore .github/test-signing/debug.keystore \
            -storepass android | grep -i 'SHA256:' | head -1 | tr -d ' \t')
          # find, not ls: a filename with a space would break the glob (shellcheck SC2012).
          APK=$(find app/build/outputs/apk/sideload/staging -name '*.apk' -type f | head -1)
          ACTUAL=$(keytool -printcert -jarfile "$APK" -v | grep -i 'SHA256:' | head -1 | tr -d ' \t')
          echo "APK:      $APK"
          echo "expected: $EXPECTED"
          echo "actual:   $ACTUAL"
          if [ "$EXPECTED" != "$ACTUAL" ]; then
            echo "::error::Signature mismatch - Gradle did not use the committed keystore."
            exit 1
          fi
          echo "Signature verified against the committed keystore."

      # Proves the suffix really landed on the built artifact, not just in the
      # build file - the package name is what decides whether this installs
      # beside the other test APKs or over one of them.
      - name: Show the package name of the finished APK
        run: |
          AAPT=$(find "$ANDROID_HOME/build-tools" -name aapt2 -type f | sort | tail -1)
          APK=$(find app/build/outputs/apk/sideload/staging -name '*.apk' -type f | head -1)
          "$AAPT" dump packagename "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: arvio-forced-apk
          path: app/build/outputs/apk/sideload/staging/*.apk
          if-no-files-found: error
          retention-days: 14
