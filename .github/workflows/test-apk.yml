name: Test APK (discover grid)

# Test-branch only. This workflow and the committed keystore must never reach a
# pull request against upstream - they exist so a Claude Code session can hand
# the user an installable build. `workflow_dispatch` returns 403 from such a
# session (the app token has no `actions: write`), so a push to this branch is
# the trigger.

on:
  push:
    branches:
      - claude/entdecken-test-apk
  workflow_dispatch:

jobs:
  build-test-apk:
    name: Build sideload staging test APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      # The discover grid is pure TMDB browsing, so a placeholder key would
      # leave the tester with an empty app and nothing to test.
      - name: Prepare runtime configuration
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: |
          cp secrets.defaults.properties secrets.properties
          if [ -n "$TMDB_API_KEY" ]; then
            sed -i "s|^TMDB_API_KEY=.*|TMDB_API_KEY=$TMDB_API_KEY|" secrets.properties
            echo "TMDB key injected"
          else
            echo "::error::TMDB_API_KEY secret is empty - this feature cannot be tested without it"
            exit 1
          fi

      - name: Compile and run unit tests
        run: |
          # EpgRefreshRequestsTest is a known, order-dependent flake (docs/34 5z):
          # another ViewModel test leaves a coroutine on the Main dispatcher. It is
          # NOT silenced - the whole suite simply gets the second run the office
          # rules prescribe, and the build still fails if it stays red.
          ./gradlew testSideloadDebugUnitTest --no-daemon \
            || ./gradlew testSideloadDebugUnitTest --no-daemon --rerun-tasks

      - name: Give the staging build its own package, name and a fixed signature
        run: |
          # Kennung "entdecken" - the identifier of the search/discover theme
          # (docs/10, AGENTS.md rule 10). It steers all three places: the
          # package suffix, the name in the launcher, and the artifact name.
          # It stays the same as the debug APK of 12.09., so this build installs
          # OVER that one instead of beside it.
          sed -i 's|<string name="app_name">ARVIO</string>|<string name="app_name">Entdecken</string>|' \
            app/src/main/res/values/strings.xml
          # staging differs from debug here: it already carries a ready
          # `applicationIdSuffix = ".beta"` line, so this REPLACES it instead of
          # inserting after the block header (docs/10, "Beim Wechsel der Sorte").
          sed -i 's/            applicationIdSuffix = ".beta"/            applicationIdSuffix = ".entdecken"/' app/build.gradle.kts
          # staging inherits the release-only cloud-secret check, which has no
          # real keys in a fork and stops the build after ~19 seconds. It exists
          # so such a build is not PUBLISHED, not so it cannot be tested; the
          # unit-test step above is untouched and still fails the build.
          sed -i 's|dependsOn(validateReleaseCloudSecrets)|// CI test build only: cloud-secret check not applicable in a fork|' app/build.gradle.kts
          sed -i "s/versionCode = [0-9]*/versionCode = $((950000 + GITHUB_RUN_NUMBER))/" app/build.gradle.kts
          # A sed that silently matches nothing is how this kind of workflow
          # wastes a build cycle - check every edit.
          grep -q '<string name="app_name">Entdecken</string>' app/src/main/res/values/strings.xml \
            || { echo "::error::app_name patch did not apply"; exit 1; }
          grep -q 'applicationIdSuffix = ".entdecken"' app/build.gradle.kts || { echo "::error::suffix patch did not apply"; exit 1; }
          if grep -q 'applicationIdSuffix = ".beta"' app/build.gradle.kts; then
            echo "::error::the .beta suffix is still there - this APK would install beside the old one, not over it"; exit 1
          fi
          if grep -q 'dependsOn(validateReleaseCloudSecrets)' app/build.gradle.kts; then
            echo "::error::cloud-secret patch did not apply"; exit 1
          fi
          grep -q "versionCode = $((950000 + GITHUB_RUN_NUMBER))" app/build.gradle.kts || { echo "::error::versionCode patch did not apply"; exit 1; }
          cat >> app/build.gradle.kts <<'KTS'

          // CI only: on a runner the signing config named "debug" points at a
          // freshly generated ~/.android/debug.keystore, so every build would
          // carry a different signature and the tester could not install one
          // test APK over the previous one. Pin it to the committed keystore.
          // staging signs with this very config too - it asks for "release"
          // first, and a fork has none, so it falls back to "debug". That is
          // what lets this staging APK install over the debug one of 12.09.
          android {
              signingConfigs {
                  getByName("debug") {
                      storeFile = rootProject.file(".github/test-signing/debug.keystore")
                      storePassword = "android"
                      keyAlias = "androiddebugkey"
                      keyPassword = "android"
                  }
              }
          }
          KTS

      # Mess-APK: staging is release-grade with R8. The test question this time
      # is "does it stutter?", and per docs/10 only this variant can answer it -
      # a debug build runs measurably more sluggishly on the TV.
      - name: Build sideload staging APK
        run: ./gradlew assembleSideloadStaging --no-daemon

      - name: Verify APK signature against the committed keystore
        run: |
          EXPECTED=$(keytool -list -v -keystore .github/test-signing/debug.keystore \
            -storepass android | grep -i 'SHA256:' | head -1 | tr -d ' \t')
          APK=$(ls app/build/outputs/apk/sideload/staging/*.apk | head -1)
          ACTUAL=$(keytool -printcert -jarfile "$APK" -v | grep -i 'SHA256:' | head -1 | tr -d ' \t')
          echo "APK:      $APK"
          echo "expected: $EXPECTED"
          echo "actual:   $ACTUAL"
          if [ "$EXPECTED" != "$ACTUAL" ]; then
            echo "::error::Signature mismatch - Gradle did not use the committed keystore."
            exit 1
          fi
          echo "Signature verified against the committed keystore."

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: arvio-entdecken-apk
          path: app/build/outputs/apk/sideload/staging/*.apk
          if-no-files-found: error
          retention-days: 14
