name: Test APK (B12 content rating chip)

on:
  push:
    branches:
      - claude/b12-test-apk
  workflow_dispatch:

jobs:
  build-test-apk:
    name: Build sideload debug test APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Prepare runtime configuration
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: |
          cp secrets.defaults.properties secrets.properties
          if [ -n "$TMDB_API_KEY" ]; then
            sed -i "s|^TMDB_API_KEY=.*|TMDB_API_KEY=$TMDB_API_KEY|" secrets.properties
            echo "TMDB key injected"
          else
            echo "::warning::TMDB_API_KEY secret is empty - the test app will show no content"
          fi

      - name: Inject fixed test signing + suffix into debug build type
        run: |
          sed -i '/^        debug {/a\
              applicationIdSuffix = ".b12"\
              signingConfig = signingConfigs.create("fixedTestDebug") {\
                  storeFile = rootProject.file(".github/test-signing/debug.keystore")\
                  storePassword = "android"\
                  keyAlias = "androiddebugkey"\
                  keyPassword = "android"\
              }' app/build.gradle.kts
          sed -i "s/versionCode = [0-9]*/versionCode = $((310 + GITHUB_RUN_NUMBER))/" app/build.gradle.kts

      - name: Run unit tests
        run: ./gradlew testSideloadDebugUnitTest --no-daemon

      - name: Build sideload debug APK
        run: ./gradlew assembleSideloadDebug --no-daemon

      - name: Verify APK signature against the committed keystore
        run: |
          EXPECTED=$(keytool -list -v -keystore .github/test-signing/debug.keystore \
            -storepass android | grep -i 'SHA256:' | head -1 | tr -d ' \t')
          APK=$(ls app/build/outputs/apk/sideload/debug/*.apk | head -1)
          ACTUAL=$(keytool -printcert -jarfile "$APK" -v | grep -i 'SHA256:' | head -1 | tr -d ' \t')
          echo "APK:      $APK"
          echo "expected: $EXPECTED"
          echo "actual:   $ACTUAL"
          if [ "$EXPECTED" != "$ACTUAL" ]; then
            echo "::error::Signature mismatch - Gradle did not use the committed keystore."
            exit 1
          fi
          echo "Signature verified against the committed keystore."

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: arvio-b12-content-rating-chip-test-apk
          path: app/build/outputs/apk/sideload/debug/*.apk
          if-no-files-found: error
          retention-days: 7
