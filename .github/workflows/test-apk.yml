name: Test APK (reset button at the end of the discover filter row)

# Test-branch only. This workflow and the committed keystore must never reach a
# pull request against upstream - they exist so a Claude Code session can hand
# the user an installable build. `workflow_dispatch` returns 403 from such a
# session (the app token has no `actions: write`), so a push to this branch is
# the trigger.

on:
  push:
    branches:
      - claude/entdecken-f11-test-apk
  workflow_dispatch:

jobs:
  build-test-apk:
    name: Build sideload debug test APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      # The search screen IS the TMDB screen: without a real key there is nothing
      # to focus and nothing to type into, so the round cannot be tested at all.
      - name: Prepare runtime configuration
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: |
          cp secrets.defaults.properties secrets.properties
          if [ -n "$TMDB_API_KEY" ]; then
            sed -i "s|^TMDB_API_KEY=.*|TMDB_API_KEY=$TMDB_API_KEY|" secrets.properties
            echo "TMDB key injected"
          else
            echo "::error::TMDB_API_KEY secret is empty - this feature cannot be tested without it"
            exit 1
          fi

      # Sanity check: this round is about the reset chip, so the build is
      # worthless without it. The step this replaces belonged to the suchfokus
      # round and grepped for `startSearchEditing()` - upstream has since given
      # that call an argument (7d20d2a), so it now fails on a branch that is
      # perfectly fine. A sanity check has to be about THIS round, or it only
      # reports how old the template is.
      - name: Verify the reset chip is present
        run: |
          grep -q 'DiscoverFilterId.CLEAR' app/src/main/kotlin/com/arflix/tv/ui/screens/search/DiscoverFilterSpecs.kt \
            || { echo "::error::the reset chip is not in the row"; exit 1; }
          grep -q 'onClearFilters = viewModel::clearDiscoverFilters' app/src/main/kotlin/com/arflix/tv/ui/screens/search/SearchScreen.kt \
            || { echo "::error::the reset chip is not wired to the view model"; exit 1; }
          grep -q 'focusAfterClearChip' app/src/main/kotlin/com/arflix/tv/ui/screens/search/SearchScreen.kt \
            || { echo "::error::the focus is not moved off the chip that deletes itself"; exit 1; }

      # The last test APK went out WITHOUT the TV preview and the user could not
      # test on a phone at all (LAGE.md, 15.09.). This step stops that from
      # happening silently: it fails BEFORE the build if upstream has reworked
      # the place the preview is patched into (docs/arbeitsweise/43).
      - name: Verify the TV preview patch is present
        run: |
          grep -q 'TvPreviewLetterbox' app/src/main/kotlin/com/arflix/tv/MainActivity.kt \
            || { echo "::error::TV preview letterbox missing"; exit 1; }
          grep -q 'deviceModeOverride == "tv" && hasTouchScreen' app/src/main/kotlin/com/arflix/tv/MainActivity.kt \
            || { echo "::error::TV preview guard missing or changed"; exit 1; }

      # Several tests in this repo wait on a wall clock and go red on a loaded
      # runner - EpgRefreshRequestsTest (docs/34 5z), EpgProgramActionsTest and
      # SearchViewModelTest.peopleOnlySearchWaitsForMissingCredits... - and none
      # of them belongs to this branch. The office rule for telling them apart is
      # written down (docs/46 2m): a run where each attempt trips over a DIFFERENT
      # test is a slow runner; the SAME test twice is a real failure. Run 156 hit
      # exactly that - two attempts, two different clock tests - so the rule is
      # applied here instead of by hand.
      #
      # Nothing is silenced or skipped: a test that fails in BOTH attempts still
      # fails the build, and every failure is printed either way.
      - name: Compile and run unit tests
        run: |
          set -u
          collect() {
            python3 - "$1" <<'PY'
          import glob, sys, xml.etree.ElementTree as ET
          names = set()
          for f in glob.glob("app/build/test-results/testSideloadDebugUnitTest/*.xml"):
              for case in ET.parse(f).getroot().iter("testcase"):
                  if case.find("failure") is not None or case.find("error") is not None:
                      names.add(f'{case.get("classname")}.{case.get("name")}')
          open(sys.argv[1], "w").write("".join(n + chr(10) for n in sorted(names)))
          for n in sorted(names):
              print(f"  failed: {n}")
          PY
          }

          ./gradlew testSideloadDebugUnitTest --no-daemon && exit 0
          echo "::warning::first attempt had failures - collecting them"
          collect /tmp/fail1.txt

          ./gradlew testSideloadDebugUnitTest --no-daemon --rerun-tasks && {
            echo "::warning::second attempt was fully green - the first was the runner"
            exit 0
          }
          echo "::warning::second attempt had failures - collecting them"
          collect /tmp/fail2.txt

          BOTH=$(comm -12 /tmp/fail1.txt /tmp/fail2.txt)
          if [ -n "$BOTH" ]; then
            echo "::error::the same test failed in both attempts - this is real:"
            echo "$BOTH"
            exit 1
          fi
          echo "::warning::each attempt tripped over a DIFFERENT test - loaded runner (docs/46 2m), not this branch"

      # The office wants the test count as a measured number, not a guess: "1059 -> 1066".
      # Gradle does not print one, so it is summed out of the JUnit XML the run just wrote.
      - name: Count the unit tests
        if: always()
        run: |
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          tests = failures = errors = skipped = 0
          for f in glob.glob("app/build/test-results/testSideloadDebugUnitTest/*.xml"):
              r = ET.parse(f).getroot()
              tests += int(r.get("tests", 0)); failures += int(r.get("failures", 0))
              errors += int(r.get("errors", 0)); skipped += int(r.get("skipped", 0))
          print(f"unit tests: {tests} | failures: {failures} | errors: {errors} | skipped: {skipped}")
          PY

      # The office rule is "detekt rule for rule unchanged", and the fork CI does
      # not run detekt at all - so the count is taken here, where the Android SDK
      # exists. It never fails the build: the comparison is the point, not a gate.
      - name: Count detekt findings rule by rule
        continue-on-error: true
        run: |
          ./gradlew detekt --no-daemon || true
          for report in app/build/reports/detekt/*.xml; do
            [ -f "$report" ] || continue
            echo "== $report"
            grep -o 'source="[^"]*"' "$report" | wc -l | sed 's/^/  findings: /'
            grep -o '<error[^>]*source="[^"]*"' "$report" \
              | sed -n 's/.*source="detekt\.\([^"]*\)".*/\1/p' | sort | uniq -c | sort -rn
          done

      - name: Give the debug build its own package, name and a fixed signature
        run: |
          # Kennung "entdecken" - the identifier of THIS theme, the discover
          # filter row (docs/10, AGENTS.md rule 10). It steers all three places:
          # the package suffix, the name in the launcher, and the artifact name.
          # It is the SAME identifier the earlier filter rounds used, which is
          # the point: this build installs OVER the previous discover APK
          # instead of beside it, so portal, MAC and playlists stay entered.
          sed -i 's|<string name="app_name">ARVIO</string>|<string name="app_name">Entdecken</string>|' \
            app/src/main/res/values/strings.xml
          # debug differs from staging here: the `applicationIdSuffix` line is
          # commented out, so this INSERTS one after the block header instead of
          # replacing it (docs/10, "Beim Wechsel der Sorte mitdenken").
          sed -i '0,/^        debug {$/s//        debug {\n            applicationIdSuffix = ".entdecken"/' app/build.gradle.kts
          sed -i "s/versionCode = [0-9]*/versionCode = $((950000 + GITHUB_RUN_NUMBER))/" app/build.gradle.kts
          # A sed that silently matches nothing is how this kind of workflow
          # wastes a build cycle - check every edit.
          grep -q '<string name="app_name">Entdecken</string>' app/src/main/res/values/strings.xml \
            || { echo "::error::app_name patch did not apply"; exit 1; }
          grep -q 'applicationIdSuffix = ".entdecken"' app/build.gradle.kts \
            || { echo "::error::suffix patch did not apply"; exit 1; }
          grep -q "versionCode = $((950000 + GITHUB_RUN_NUMBER))" app/build.gradle.kts \
            || { echo "::error::versionCode patch did not apply"; exit 1; }
          cat >> app/build.gradle.kts <<'KTS'

          // CI only: on a runner the signing config named "debug" points at a
          // freshly generated ~/.android/debug.keystore, so every build would
          // carry a different signature and the tester could not install one
          // test APK over the previous one. Pin it to the committed keystore.
          android {
              signingConfigs {
                  getByName("debug") {
                      storeFile = rootProject.file(".github/test-signing/debug.keystore")
                      storePassword = "android"
                      keyAlias = "androiddebugkey"
                      keyPassword = "android"
                  }
              }
          }
          KTS

      # Schnell-APK (docs/10, and what the F11 assignment prescribes): the
      # questions of this round are about BEHAVIOUR - does the eighth chip
      # appear only with a filter set, does one press clear them all, and where
      # does the focus ring sit once the chip has removed itself. The measuring
      # build is for questions about speed and stutter.
      - name: Build sideload debug APK
        run: ./gradlew assembleSideloadDebug --no-daemon

      - name: Verify APK signature against the committed keystore
        run: |
          EXPECTED=$(keytool -list -v -keystore .github/test-signing/debug.keystore \
            -storepass android | grep -i 'SHA256:' | head -1 | tr -d ' \t')
          # find, not ls: a filename with a space would break the glob (shellcheck SC2012).
          APK=$(find app/build/outputs/apk/sideload/debug -name '*.apk' -type f | head -1)
          ACTUAL=$(keytool -printcert -jarfile "$APK" -v | grep -i 'SHA256:' | head -1 | tr -d ' \t')
          echo "APK:      $APK"
          echo "expected: $EXPECTED"
          echo "actual:   $ACTUAL"
          if [ "$EXPECTED" != "$ACTUAL" ]; then
            echo "::error::Signature mismatch - Gradle did not use the committed keystore."
            exit 1
          fi
          echo "Signature verified against the committed keystore."

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: arvio-entdecken-apk
          path: app/build/outputs/apk/sideload/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      # androidTest is not built by the unit-test task, so a device test that no
      # longer compiles would otherwise go unnoticed until somebody ran it.
      - name: Compile the device tests
        run: ./gradlew assembleSideloadDebugAndroidTest --no-daemon

