name: Test APK (CloudStream C2 fix)

on:
  workflow_dispatch:

jobs:
  build-test-apk:
    name: Build sideload debug test APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Prepare runtime configuration
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: |
          cp secrets.defaults.properties secrets.properties
          if [ -n "$TMDB_API_KEY" ]; then
            sed -i "s|^TMDB_API_KEY=.*|TMDB_API_KEY=$TMDB_API_KEY|" secrets.properties
          fi

      - name: Inject fixed test signing + suffix into debug build type
        run: |
          sed -i '/^        debug {/a\
              applicationIdSuffix = ".test"\
              signingConfig = signingConfigs.create("fixedTestDebug") {\
                  storeFile = file(".github/test-signing/debug.keystore")\
                  storePassword = "android"\
                  keyAlias = "androiddebugkey"\
                  keyPassword = "android"\
              }' app/build.gradle.kts
          sed -i "s/versionCode = [0-9]*/versionCode = $((310 + GITHUB_RUN_NUMBER))/" app/build.gradle.kts

      - name: Build sideload debug APK
        run: ./gradlew assembleSideloadDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: arvio-cloudstream-test-apk
          path: app/build/outputs/apk/sideload/debug/*.apk
          if-no-files-found: error
          retention-days: 7
