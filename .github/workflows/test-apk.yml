name: "Test APK (Trakt activation round 2 - QR code, countdown, success, expiry)"

# Test-branch only. This workflow and the committed keystore must never reach a
# pull request against upstream - they exist so a Claude Code session can hand
# the user an installable build. `workflow_dispatch` returns 403 from such a
# session (the app token has no `actions: write`), so a push to this branch is
# the trigger.

on:
  push:
    branches:
      - claude/traktlogin-k2-test-apk
  workflow_dispatch:

jobs:
  build-test-apk:
    name: Build sideload debug test APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      # Without real keys the app cannot do the thing under test. Round 1 only
      # injected TMDB and the app answered "Trakt-Aktivierung fehlgeschlagen
      # (400)": secrets.defaults.properties ships TRAKT_CLIENT_ID as the
      # placeholder "your-trakt-client-id", Constants.usableSecret turns any
      # "your-" value into an empty string, and Trakt rejects an empty client_id
      # with 400 before any dialog is drawn. The real keys are injected the same
      # way build-check.yml does it.
      - name: Prepare runtime configuration
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          TRAKT_CLIENT_ID: ${{ secrets.TRAKT_CLIENT_ID }}
          TRAKT_CLIENT_SECRET: ${{ secrets.TRAKT_CLIENT_SECRET }}
        run: |
          cp secrets.defaults.properties secrets.properties
          if [ -z "$TMDB_API_KEY" ]; then
            echo "::error::TMDB_API_KEY secret is empty - the app would start as an empty browser"
            exit 1
          fi
          if [ -z "$TRAKT_CLIENT_ID" ] || [ -z "$TRAKT_CLIENT_SECRET" ]; then
            echo "::error::TRAKT_CLIENT_ID/SECRET repository secret is empty - Trakt would answer 400 again"
            exit 1
          fi
          sed -i "s|^TMDB_API_KEY=.*|TMDB_API_KEY=$TMDB_API_KEY|" secrets.properties
          sed -i "s|^TRAKT_CLIENT_ID=.*|TRAKT_CLIENT_ID=$TRAKT_CLIENT_ID|" secrets.properties
          sed -i "s|^TRAKT_CLIENT_SECRET=.*|TRAKT_CLIENT_SECRET=$TRAKT_CLIENT_SECRET|" secrets.properties
          # The placeholders are what caused round 1 to fail, so prove they are
          # gone. Only the shape is printed, never a value.
          if grep -qi '^TRAKT_CLIENT_ID=your-\|^TRAKT_CLIENT_SECRET=your-\|^TMDB_API_KEY=your-' secrets.properties; then
            echo "::error::a placeholder survived in secrets.properties"
            exit 1
          fi
          echo "keys injected; TRAKT_CLIENT_ID length: ${#TRAKT_CLIENT_ID}"

      # Sanity check: the TV preview must be in this build, and it must be the
      # kind that only fires when the user forces TV mode on a touch device.
      - name: Verify the TV preview patch is present
        run: |
          grep -q 'TvPreviewLetterbox' app/src/main/kotlin/com/arflix/tv/MainActivity.kt \
            || { echo "::error::TV preview letterbox missing"; exit 1; }
          grep -q 'deviceModeOverride == "tv" && hasTouchScreen' app/src/main/kotlin/com/arflix/tv/MainActivity.kt \
            || { echo "::error::TV preview guard missing or changed"; exit 1; }

      # The point of THIS round, checked before a build is spent on it. Round 1's
      # checks are kept where they still describe something this round must not
      # break (the phone buttons, Plex keeping its copy button).
      - name: Verify round 1 still stands
        run: |
          grep -q 'internal fun traktActivationUrl' app/src/main/kotlin/com/arflix/tv/ui/screens/settings/SettingsScreen.kt \
            || { echo "::error::URL builder missing"; exit 1; }
          grep -q 'openUrlLabel = stringResource(R.string.settings_open_trakt_page)' app/src/main/kotlin/com/arflix/tv/ui/screens/settings/SettingsScreen.kt \
            || { echo "::error::the phone button would read 'Open auth page' again"; exit 1; }
          # Exactly one call site may drop the copy button - Trakt. If this counts
          # 2, Plex or Jellyfin lost a button they still need.
          test "$(grep -c 'showCopyCode = false' app/src/main/kotlin/com/arflix/tv/ui/screens/settings/SettingsScreen.kt)" = "1" \
            || { echo "::error::exactly one call site must set showCopyCode = false"; exit 1; }
          grep -q 'if (isMobile && onOpenUrl != null)' app/src/main/kotlin/com/arflix/tv/ui/screens/settings/SettingsScreen.kt \
            || { echo "::error::the isMobile gate for the phone buttons is gone"; exit 1; }
          echo "round 1 intact: url builder, phone label, copy button kept for Plex, isMobile gate"

      - name: Verify the QR code now carries the user code
        run: |
          S=app/src/main/kotlin/com/arflix/tv/ui/screens/settings/SettingsScreen.kt
          grep -q 'qrData: String? = null' "$S" \
            || { echo "::error::the dialog has no qrData parameter"; exit 1; }
          grep -q 'val qrPayload = qrData?.takeIf { it.isNotBlank() } ?: verificationUrl' "$S" \
            || { echo "::error::the QR payload is not derived from qrData"; exit 1; }
          grep -q 'data = qrPayload,' "$S" \
            || { echo "::error::the QR image still renders the bare verification URL"; exit 1; }
          # T19: ONLY Trakt may fill it. Plex's URL is a fragment URL and would
          # break if a code were appended, so a second call site here is a bug.
          test "$(grep -c 'qrData = ' "$S")" = "1" \
            || { echo "::error::exactly one call site may pass qrData (T19)"; exit 1; }
          grep -q 'val qrContainerSize = if (isMobile) 0.dp else 224.dp' "$S" \
            || { echo "::error::the QR frame is not 224.dp - the denser code would shrink"; exit 1; }
          echo "qr verified: payload carries the code, frame 224.dp, only Trakt fills it"

      - name: Verify the remaining-time display
        run: |
          S=app/src/main/kotlin/com/arflix/tv/ui/screens/settings/SettingsScreen.kt
          V=app/src/main/kotlin/com/arflix/tv/ui/screens/settings/SettingsViewModel.kt
          grep -q 'val traktCodeExpiresAtMillis: Long? = null' "$V" \
            || { echo "::error::the ui state carries no expiry"; exit 1; }
          # Must be computed in the view model, not in the composable - otherwise
          # every recomposition would reset the clock.
          grep -q 'traktCodeExpiresAtMillis = System.currentTimeMillis()' "$V" \
            || { echo "::error::the expiry is not computed in the view model"; exit 1; }
          grep -q 'expiresAtMillis: Long? = null' "$S" \
            || { echo "::error::the dialog takes no expiry"; exit 1; }
          grep -q 'expiresAtMillis = uiState.traktCodeExpiresAtMillis' "$S" \
            || { echo "::error::the Trakt call site does not pass the expiry"; exit 1; }
          echo "countdown verified: expiry computed in the view model and handed to the dialog"

      - name: Verify the two device-specific instruction texts
        run: |
          for f in app/src/main/res/values/strings.xml app/src/main/res/values-de/strings.xml; do
            grep -q 'name="settings_activation_instruction_tv"' "$f" \
              || { echo "::error::TV instruction missing in $f"; exit 1; }
            grep -q 'name="settings_activation_instruction_touch"' "$f" \
              || { echo "::error::touch instruction missing in $f"; exit 1; }
          done
          # Deliberately service-neutral (akte docs/50 section 7): the SIMKL PR
          # reuses these, and the dialog title already names the service.
          if grep -E 'name="settings_activation_instruction_(tv|touch)"' \
               app/src/main/res/values/strings.xml app/src/main/res/values-de/strings.xml \
               | grep -qi 'trakt'; then
            echo "::error::the new instruction strings must not name Trakt"
            exit 1
          fi
          grep -q 'stringResource(R.string.settings_activation_instruction_touch)' \
            app/src/main/kotlin/com/arflix/tv/ui/screens/settings/SettingsScreen.kt \
            || { echo "::error::the Trakt call site does not choose per device"; exit 1; }
          echo "instructions verified: both strings in both languages, no service name, chosen per device"

      - name: Verify the success and expiry panels
        run: |
          S=app/src/main/kotlin/com/arflix/tv/ui/screens/settings/SettingsScreen.kt
          V=app/src/main/kotlin/com/arflix/tv/ui/screens/settings/SettingsViewModel.kt
          grep -q 'enum class TraktAuthOutcome' "$V" \
            || { echo "::error::TraktAuthOutcome is missing"; exit 1; }
          grep -q 'traktAuthOutcome = TraktAuthOutcome.CONNECTED' "$V" \
            || { echo "::error::success never reaches the dialog"; exit 1; }
          grep -q 'traktAuthOutcome = TraktAuthOutcome.EXPIRED' "$V" \
            || { echo "::error::expiry never reaches the dialog"; exit 1; }
          # Only a plain timeout may take the expiry path; a real HTTP failure
          # must keep its toast and close the dialog as before.
          grep -q 'if (lastFailure == null) {' "$V" \
            || { echo "::error::expiry is not limited to a plain timeout"; exit 1; }
          grep -q 'outcome = uiState.traktAuthOutcome' "$S" \
            || { echo "::error::the call site does not pass the outcome"; exit 1; }
          grep -q 'onRetry = { viewModel.startTraktAuth() }' "$S" \
            || { echo "::error::retry is not wired"; exit 1; }
          # E13: running out of time is not an error, so no red anywhere in the
          # expired panel - it is a grey clock.
          grep -q 'Icons.Default.Schedule' "$S" \
            || { echo "::error::the grey clock is missing"; exit 1; }
          if grep -nE 'TraktAuthOutcome.EXPIRED' -A 4 "$S" | grep -qiE 'E74C3C|E53935|Color.Red'; then
            echo "::error::the expired panel must not use an error colour (E13)"
            exit 1
          fi
          echo "panels verified: outcome enum, success, timeout-only expiry, retry wired, grey clock"

      - name: Compile and run unit tests
        run: |
          # A second run is the office rule for the known order-dependent flakes
          # (docs/34 5z): another ViewModel test can leave a coroutine on the Main
          # dispatcher. Nothing is silenced - the build still fails if it stays red.
          ./gradlew testSideloadDebugUnitTest --no-daemon \
            || ./gradlew testSideloadDebugUnitTest --no-daemon --rerun-tasks

      # The office wants the test count as a measured number, not a guess.
      # Gradle does not print one, so it is summed out of the JUnit XML.
      - name: Count the unit tests
        if: always()
        run: |
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          tests = failures = errors = skipped = 0
          for f in glob.glob("app/build/test-results/testSideloadDebugUnitTest/*.xml"):
              r = ET.parse(f).getroot()
              tests += int(r.get("tests", 0)); failures += int(r.get("failures", 0))
              errors += int(r.get("errors", 0)); skipped += int(r.get("skipped", 0))
          print(f"unit tests: {tests} | failures: {failures} | errors: {errors} | skipped: {skipped}")
          PY

      # The office rule is "detekt rule for rule unchanged", and the fork CI does
      # not run detekt at all - so the count is taken here. It never fails the
      # build: the comparison is the point, not a gate.
      - name: Count detekt findings rule by rule
        continue-on-error: true
        run: |
          ./gradlew detekt --no-daemon || true
          for report in app/build/reports/detekt/*.xml; do
            [ -f "$report" ] || continue
            echo "== $report"
            grep -o 'source="[^"]*"' "$report" | wc -l | sed 's/^/  findings: /'
            grep -o '<error[^>]*source="[^"]*"' "$report" \
              | sed -n 's/.*source="detekt\.\([^"]*\)".*/\1/p' | sort | uniq -c | sort -rn
          done

      - name: Give the debug build its own package, name and a fixed signature
        run: |
          # Kennung "traktlogin" - the identifier of this theme (docs/10,
          # AGENTS.md rule 10). It steers all three places: package suffix,
          # launcher name and artifact name. It is a NEW identifier, so this
          # build installs BESIDE the other test APKs and starts empty.
          sed -i 's|<string name="app_name">ARVIO</string>|<string name="app_name">Trakt-Anmeldung</string>|' \
            app/src/main/res/values/strings.xml
          # debug differs from staging here: the `applicationIdSuffix` line in the
          # debug block is COMMENTED OUT on purpose, so this INSERTS a line after
          # the block header instead of replacing one (docs/10, "Beim Wechsel der
          # Sorte mitdenken").
          sed -i 's/^        debug {$/        debug {\n            applicationIdSuffix = ".traktlogin"/' \
            app/build.gradle.kts
          sed -i "s/versionCode = [0-9]*/versionCode = $((950000 + GITHUB_RUN_NUMBER))/" app/build.gradle.kts
          # A sed that silently matches nothing is how this kind of workflow
          # wastes a build cycle - check every edit.
          grep -q '<string name="app_name">Trakt-Anmeldung</string>' app/src/main/res/values/strings.xml \
            || { echo "::error::app_name patch did not apply"; exit 1; }
          grep -q 'applicationIdSuffix = ".traktlogin"' app/build.gradle.kts \
            || { echo "::error::suffix patch did not apply"; exit 1; }
          grep -q "versionCode = $((950000 + GITHUB_RUN_NUMBER))" app/build.gradle.kts \
            || { echo "::error::versionCode patch did not apply"; exit 1; }
          cat >> app/build.gradle.kts <<'KTS'

          // CI only: on a runner the signing config named "debug" points at a
          // freshly generated ~/.android/debug.keystore, so every build would
          // carry a different signature and the tester could not install one
          // test APK over the previous one. Pin it to the committed keystore.
          android {
              signingConfigs {
                  getByName("debug") {
                      storeFile = rootProject.file(".github/test-signing/debug.keystore")
                      storePassword = "android"
                      keyAlias = "androiddebugkey"
                      keyPassword = "android"
                  }
              }
          }
          KTS

      # Schnell-APK (docs/10): every test question this round is a content
      # question - "is there one button?", "does the browser open?", "is the
      # code already in the page?". None of them is about smoothness, so the
      # fast variant is not just cheaper but equally valid.
      - name: Build sideload debug APK
        run: ./gradlew assembleSideloadDebug --no-daemon

      - name: Verify APK signature against the committed keystore
        run: |
          EXPECTED=$(keytool -list -v -keystore .github/test-signing/debug.keystore \
            -storepass android | grep -i 'SHA256:' | head -1 | tr -d ' \t')
          # find, not ls: a filename with a space would break the glob (shellcheck SC2012).
          APK=$(find app/build/outputs/apk/sideload/debug -name '*.apk' -type f | head -1)
          ACTUAL=$(keytool -printcert -jarfile "$APK" -v | grep -i 'SHA256:' | head -1 | tr -d ' \t')
          echo "APK:      $APK"
          echo "expected: $EXPECTED"
          echo "actual:   $ACTUAL"
          if [ "$EXPECTED" != "$ACTUAL" ]; then
            echo "::error::Signature mismatch - Gradle did not use the committed keystore."
            exit 1
          fi
          echo "Signature verified against the committed keystore."

      # Proves the suffix really landed on the built artifact, not just in the
      # build file - the package name is what decides whether this installs
      # beside the other test APKs or over one of them.
      - name: Show the package name of the finished APK
        run: |
          AAPT=$(find "$ANDROID_HOME/build-tools" -name aapt2 -type f | sort | tail -1)
          APK=$(find app/build/outputs/apk/sideload/debug -name '*.apk' -type f | head -1)
          "$AAPT" dump packagename "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: arvio-traktlogin-apk
          path: app/build/outputs/apk/sideload/debug/*.apk
          if-no-files-found: error
          retention-days: 14
