name: Test APK (trailer UI beside the player - fast build)

# Test-branch only. This workflow and the committed keystore must never reach a
# pull request against upstream - they exist so a Claude Code session can hand
# the user an installable build. `workflow_dispatch` returns 403 from such a
# session (the app token has no `actions: write`), so a push to this branch is
# the trigger.

on:
  push:
    branches:
      - claude/trailer-test-apk
  workflow_dispatch:

jobs:
  build-test-apk:
    name: Build sideload debug test APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      # Trailers are TMDB metadata: without a real key the details screen has no
      # trailer to open and the whole round would be untestable.
      - name: Prepare runtime configuration
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: |
          cp secrets.defaults.properties secrets.properties
          if [ -n "$TMDB_API_KEY" ]; then
            sed -i "s|^TMDB_API_KEY=.*|TMDB_API_KEY=$TMDB_API_KEY|" secrets.properties
            echo "TMDB key injected"
          else
            echo "::error::TMDB_API_KEY secret is empty - this feature cannot be tested without it"
            exit 1
          fi

      # Sanity check: the TV preview must be in this build, and it must be the
      # kind that only fires when the user forces TV mode on a touch device.
      # This step belongs to no round - it is the standing requirement from
      # docs/arbeitsweise/43 and is carried over unchanged.
      - name: Verify the TV preview patch is present
        run: |
          grep -q 'TvPreviewLetterbox' app/src/main/kotlin/com/arflix/tv/MainActivity.kt \
            || { echo "::error::TV preview letterbox missing"; exit 1; }
          grep -q 'deviceModeOverride == "tv" && hasTouchScreen' app/src/main/kotlin/com/arflix/tv/MainActivity.kt \
            || { echo "::error::TV preview guard missing or changed"; exit 1; }

      # The topic-specific step for THIS round. It asks both questions: is the
      # new thing there, and is the old thing still there (docs/43, F13/F14).
      - name: Verify the trailer UI really sits beside the player
        run: |
          # --- the claim of this round: nothing is injected into the player ---
          if grep -rn 'evaluateJavascript' app/src/main/kotlin/; then
            echo "::error::evaluateJavascript is back - the compliance fix is not in this tree"; exit 1
          fi
          if grep -rn '\.ytp-' app/src/main/kotlin/; then
            echo "::error::YouTube player CSS selectors are back in the source"; exit 1
          fi
          if grep -rn 'unloadModule' app/src/main/kotlin/; then
            echo "::error::player.unloadModule is back - captions must go through ccLoadPolicy"; exit 1
          fi
          # --- captions are switched off the official way, in BOTH players ---
          test "$(grep -rc 'ccLoadPolicy(0)' \
            app/src/main/kotlin/com/arflix/tv/ui/components/YouTubeTrailerModal.kt \
            app/src/main/kotlin/com/arflix/tv/ui/components/BackgroundTrailerPlayer.kt \
            | grep -c ':1$')" = "2" \
            || { echo "::error::ccLoadPolicy(0) missing from one of the two players"; exit 1; }
          # --- mobile gets YouTube's controls, TV does not ---
          grep -q 'controls(if (youTubeControls) 1 else 0)' \
            app/src/main/kotlin/com/arflix/tv/ui/components/YouTubeTrailerModal.kt \
            || { echo "::error::the controls parameter is no longer device-dependent"; exit 1; }
          # --- the TV strip below the video, and the attribution button in it ---
          grep -q 'TvStripHeight' app/src/main/kotlin/com/arflix/tv/ui/components/YouTubeTrailerModal.kt \
            || { echo "::error::the reserved TV strip is gone"; exit 1; }
          grep -q 'YouTubeStripButton' app/src/main/kotlin/com/arflix/tv/ui/components/YouTubeTrailerModal.kt \
            || { echo "::error::the YouTube attribution button is gone"; exit 1; }
          # --- rotate-to-fullscreen on mobile ---
          grep -q 'PlayerSystemBarsEffect' app/src/main/kotlin/com/arflix/tv/ui/components/YouTubeTrailerModal.kt \
            || { echo "::error::rotate-to-fullscreen is gone"; exit 1; }
          # --- and what must STILL be there: Himanth's player and his D-pad ---
          test -f app/src/main/kotlin/com/arflix/tv/ui/components/YouTubeTrailerModal.kt \
            || { echo "::error::YouTubeTrailerModal.kt missing"; exit 1; }
          test -f app/src/main/kotlin/com/arflix/tv/ui/components/BackgroundTrailerPlayer.kt \
            || { echo "::error::BackgroundTrailerPlayer.kt missing"; exit 1; }
          grep -q 'androidyoutubeplayer' app/build.gradle.kts \
            || { echo "::error::the android-youtube-player dependency is missing"; exit 1; }
          grep -q 'androidyoutubeplayer' app/proguard-rules.pro \
            || { echo "::error::no R8 keep rules for the player"; exit 1; }
          for k in Key.DirectionLeft Key.DirectionRight Key.DirectionDown Key.MediaRewind Key.MediaFastForward; do
            grep -q "$k" app/src/main/kotlin/com/arflix/tv/ui/components/YouTubeTrailerModal.kt \
              || { echo "::error::TV remote handling lost $k"; exit 1; }
          done
          echo "Trailer round checks passed."

      - name: Compile and run unit tests
        run: |
          # EpgRefreshRequestsTest is a known, order-dependent flake (docs/34 5z):
          # another ViewModel test leaves a coroutine on the Main dispatcher. It is
          # NOT silenced - the whole suite simply gets the second run the office
          # rules prescribe, and the build still fails if it stays red.
          ./gradlew testSideloadDebugUnitTest --no-daemon \
            || ./gradlew testSideloadDebugUnitTest --no-daemon --rerun-tasks

      # The office wants the test count as a measured number, not a guess.
      # Gradle does not print one, so it is summed out of the JUnit XML the run just wrote.
      - name: Count the unit tests
        if: always()
        run: |
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          tests = failures = errors = skipped = 0
          for f in glob.glob("app/build/test-results/testSideloadDebugUnitTest/*.xml"):
              r = ET.parse(f).getroot()
              tests += int(r.get("tests", 0)); failures += int(r.get("failures", 0))
              errors += int(r.get("errors", 0)); skipped += int(r.get("skipped", 0))
          print(f"unit tests: {tests} | failures: {failures} | errors: {errors} | skipped: {skipped}")
          PY

      # The office rule is "detekt rule for rule unchanged", and the fork CI does
      # not run detekt at all - so the count is taken here, where the Android SDK
      # exists. It never fails the build: the comparison is the point, not a gate.
      - name: Count detekt findings rule by rule
        continue-on-error: true
        run: |
          ./gradlew detekt --no-daemon || true
          for report in app/build/reports/detekt/*.xml; do
            [ -f "$report" ] || continue
            echo "== $report"
            grep -o 'source="[^"]*"' "$report" | wc -l | sed 's/^/  findings: /'
            grep -o '<error[^>]*source="[^"]*"' "$report" \
              | sed -n 's/.*source="detekt\.\([^"]*\)".*/\1/p' | sort | uniq -c | sort -rn
          done

      - name: Give the debug build its own package, name and a fixed signature
        run: |
          # Kennung "trailer" (docs/10, AGENTS.md rule 10). Deliberately NOT
          # "youtube": that one carries Himanth's unchanged draft, and the user
          # needs the two side by side to compare. So this APK installs beside
          # it and starts EMPTY - portal, MAC and playlists once.
          sed -i 's|<string name="app_name">ARVIO</string>|<string name="app_name">Trailer</string>|' \
            app/src/main/res/values/strings.xml
          # debug differs from staging here: the `applicationIdSuffix` line in the
          # debug block is COMMENTED OUT on purpose, so this INSERTS a line after
          # the block header instead of replacing one (docs/10, "Beim Wechsel der
          # Sorte mitdenken").
          sed -i 's/^        debug {$/        debug {\n            applicationIdSuffix = ".trailer"/' \
            app/build.gradle.kts
          sed -i "s/versionCode = [0-9]*/versionCode = $((950000 + GITHUB_RUN_NUMBER))/" app/build.gradle.kts
          # A sed that silently matches nothing is how this kind of workflow
          # wastes a build cycle - check every edit.
          grep -q '<string name="app_name">Trailer</string>' app/src/main/res/values/strings.xml \
            || { echo "::error::app_name patch did not apply"; exit 1; }
          grep -q 'applicationIdSuffix = ".trailer"' app/build.gradle.kts \
            || { echo "::error::suffix patch did not apply"; exit 1; }
          grep -q "versionCode = $((950000 + GITHUB_RUN_NUMBER))" app/build.gradle.kts \
            || { echo "::error::versionCode patch did not apply"; exit 1; }
          cat >> app/build.gradle.kts <<'KTS'

          // CI only: on a runner the signing config named "debug" points at a
          // freshly generated ~/.android/debug.keystore, so every build would
          // carry a different signature and the tester could not install one
          // test APK over the previous one. Pin it to the committed keystore.
          android {
              signingConfigs {
                  getByName("debug") {
                      storeFile = rootProject.file(".github/test-signing/debug.keystore")
                      storePassword = "android"
                      keyAlias = "androiddebugkey"
                      keyPassword = "android"
                  }
              }
          }
          KTS

      # Schnell-APK (docs/10): every test question this round is a content
      # question - "is anything still lying over the video?", "does the strip
      # appear?", "does rotating go fullscreen?". None of them is about
      # smoothness, so the fast variant is not just cheaper but equally valid.
      - name: Build sideload debug APK
        run: ./gradlew assembleSideloadDebug --no-daemon

      - name: Verify APK signature against the committed keystore
        run: |
          EXPECTED=$(keytool -list -v -keystore .github/test-signing/debug.keystore \
            -storepass android | grep -i 'SHA256:' | head -1 | tr -d ' \t')
          # find, not ls: a filename with a space would break the glob (shellcheck SC2012).
          APK=$(find app/build/outputs/apk/sideload/debug -name '*.apk' -type f | head -1)
          ACTUAL=$(keytool -printcert -jarfile "$APK" -v | grep -i 'SHA256:' | head -1 | tr -d ' \t')
          echo "APK:      $APK"
          echo "expected: $EXPECTED"
          echo "actual:   $ACTUAL"
          if [ "$EXPECTED" != "$ACTUAL" ]; then
            echo "::error::Signature mismatch - Gradle did not use the committed keystore."
            exit 1
          fi
          echo "Signature verified against the committed keystore."

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: arvio-trailer-apk
          path: app/build/outputs/apk/sideload/debug/*.apk
          if-no-files-found: error
          retention-days: 14
