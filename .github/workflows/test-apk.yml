name: DE Test APK

on:
  push:
    branches:
      - i18n/de-batch-1
  workflow_dispatch:

concurrency:
  group: de-test-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build DE test APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Prepare placeholder build configuration
        run: cp secrets.defaults.properties secrets.properties

      - name: Inject TMDB API key
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: |
          if [ -z "$TMDB_API_KEY" ]; then
            echo "::warning::TMDB_API_KEY secret not set — APK will build without TMDB (placeholder only)."
            exit 0
          fi
          # secrets.properties is gitignored and never committed; the secrets-gradle-plugin
          # reads it to generate BuildConfig.TMDB_API_KEY (TMDB v3, @Query("api_key")).
          sed -i "s|^TMDB_API_KEY=.*|TMDB_API_KEY=$TMDB_API_KEY|" secrets.properties

      - name: Install debug signing keystore
        run: |
          mkdir -p ~/.android
          cp .github/test-signing/debug.keystore ~/.android/debug.keystore

      - name: Bump versionCode for in-place update
        run: |
          sed -i "s/versionCode = [0-9]*/versionCode = $((310 + ${{ github.run_number }}))/" app/build.gradle.kts

      - name: Set .de application-id suffix
        run: |
          sed -i 's/        debug {/        debug {\n            applicationIdSuffix = ".de"/' app/build.gradle.kts

      - name: Pin debug build to the committed debug keystore
        # Without an explicit signingConfig, Gradle falls back to a freshly generated
        # per-build debug key on ephemeral runners, so every APK has a different
        # signature and Android refuses in-place updates. Point the debug buildType at
        # our committed .github/test-signing/debug.keystore (alias androiddebugkey).
        # NOTE: must run AFTER the ".de application-id suffix" step, so we anchor on
        # "isMinifyEnabled = false" (unique to the debug buildType) rather than on the
        # "debug {" line that the suffix step already modified.
        run: |
          KEYSTORE="$(pwd)/.github/test-signing/debug.keystore"
          python3 - "$KEYSTORE" <<'PY'
          import sys
          ks = sys.argv[1]
          p = "app/build.gradle.kts"
          s = open(p, encoding="utf-8").read()
          # Add a "testDebug" signing config right after the existing "release" block.
          if 'create("testDebug")' not in s:
              s = s.replace(
                  '        create("release") {',
                  '        create("testDebug") {\n'
                  '            storeFile = file("' + ks + '")\n'
                  '            storePassword = "android"\n'
                  '            keyAlias = "androiddebugkey"\n'
                  '            keyPassword = "android"\n'
                  '        }\n'
                  '        create("release") {',
                  1,
              )
          # Assign it to the debug buildType. Anchor on "isMinifyEnabled = false",
          # which is unique to the debug buildType and unaffected by the earlier
          # applicationIdSuffix injection.
          if 'signingConfig = signingConfigs.getByName("testDebug")' not in s:
              s = s.replace(
                  '            isMinifyEnabled = false',
                  '            isMinifyEnabled = false\n'
                  '            signingConfig = signingConfigs.getByName("testDebug")',
                  1,
              )
          open(p, "w", encoding="utf-8").write(s)
          PY

      - name: Build debug APK
        run: ./gradlew assembleSideloadDebug --no-daemon

      - name: Upload DE test APK
        uses: actions/upload-artifact@v4
        with:
          name: arvio-de-test
          path: app/build/outputs/apk/sideload/debug/*.apk
          if-no-files-found: error
          retention-days: 7
