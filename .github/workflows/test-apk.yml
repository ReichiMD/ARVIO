name: Test APK (Stalker protocol fixes)

# Test-branch only. This workflow and the committed keystore must never reach a
# pull request against upstream — they exist so a Claude Code session can hand
# the user an installable build. `workflow_dispatch` returns 403 from such a
# session (the app token has no `actions: write`), so a push to this branch is
# the trigger.

on:
  push:
    branches:
      - claude/stalker-protokoll-test-apk
  workflow_dispatch:

jobs:
  build-test-apk:
    name: Build sideload staging test APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      # This build is judged against the user's own IPTV portals, so TMDB is not
      # what it stands or falls on — a missing key only empties the non-live
      # rows and must not fail the build.
      - name: Prepare runtime configuration
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: |
          cp secrets.defaults.properties secrets.properties
          if [ -n "$TMDB_API_KEY" ]; then
            sed -i "s|^TMDB_API_KEY=.*|TMDB_API_KEY=$TMDB_API_KEY|" secrets.properties
            echo "TMDB key injected"
          else
            echo "::warning::TMDB_API_KEY secret is empty - the test app will show no TMDB content"
          fi

      - name: Compile and run unit tests
        run: ./gradlew testSideloadDebugUnitTest --no-daemon

      # `staging` is `release` with R8 and shrinking — the same optimisation
      # level real users run, so the retry timing this build is meant to show
      # is the timing they would actually get.
      #
      # Suffix `.test` is the house standard from docs/10 and deliberately not
      # B23's `.zaptest`: that test app is still on the devices waiting for
      # Prodigy's answer and must not be overwritten by this build.
      - name: Give the staging build its own package and a fixed signature
        run: |
          sed -i 's/applicationIdSuffix = ".beta"/applicationIdSuffix = ".test"/' app/build.gradle.kts
          sed -i 's/versionNameSuffix = "-beta"/versionNameSuffix = "-test"/' app/build.gradle.kts
          sed -i "s/versionCode = [0-9]*/versionCode = $((600 + GITHUB_RUN_NUMBER))/" app/build.gradle.kts
          # `staging` inherits from `release`, so it also inherits the gate that
          # refuses to build without real Supabase and Trakt credentials. Those
          # are upstream release secrets this fork does not have; the gate exists
          # to stop such a build being *shipped*, which is not what this is.
          # Cloud login and sync are therefore not usable in this APK —
          # everything local, IPTV included, is.
          sed -i 's|dependsOn(validateReleaseCloudSecrets)|// CI test build only: cloud-secret gate disabled|' app/build.gradle.kts
          # Every edit above is checked. A sed that silently matches nothing is
          # how this kind of workflow wastes a build cycle (docs/12 learned it
          # the hard way).
          grep -q 'applicationIdSuffix = ".test"' app/build.gradle.kts || { echo "::error::suffix patch did not apply"; exit 1; }
          grep -q 'versionNameSuffix = "-test"' app/build.gradle.kts || { echo "::error::versionName patch did not apply"; exit 1; }
          grep -q 'cloud-secret gate disabled' app/build.gradle.kts || { echo "::error::cloud-secret gate patch did not apply"; exit 1; }
          grep -q "versionCode = $((600 + GITHUB_RUN_NUMBER))" app/build.gradle.kts || { echo "::error::versionCode patch did not apply"; exit 1; }
          cat >> app/build.gradle.kts <<'KTS'

          // CI only: the staging build type falls back to the signing config named
          // "debug" when no release keystore is configured. On a runner that config
          // points at a freshly generated ~/.android/debug.keystore, so every build
          // would carry a different signature and testers could not install one test
          // APK over the previous one. Pin it to the committed keystore instead.
          android {
              signingConfigs {
                  getByName("debug") {
                      storeFile = rootProject.file(".github/test-signing/debug.keystore")
                      storePassword = "android"
                      keyAlias = "androiddebugkey"
                      keyPassword = "android"
                  }
              }
          }
          KTS

      - name: Build sideload staging APK
        run: ./gradlew assembleSideloadStaging --no-daemon

      - name: Verify APK signature against the committed keystore
        run: |
          EXPECTED=$(keytool -list -v -keystore .github/test-signing/debug.keystore \
            -storepass android | grep -i 'SHA256:' | head -1 | tr -d ' \t')
          APK=$(ls app/build/outputs/apk/sideload/staging/*.apk | head -1)
          ACTUAL=$(keytool -printcert -jarfile "$APK" -v | grep -i 'SHA256:' | head -1 | tr -d ' \t')
          echo "APK:      $APK"
          echo "expected: $EXPECTED"
          echo "actual:   $ACTUAL"
          if [ "$EXPECTED" != "$ACTUAL" ]; then
            echo "::error::Signature mismatch - Gradle did not use the committed keystore."
            exit 1
          fi
          echo "Signature verified against the committed keystore."

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: arvio-stalker-protokoll-test-apk
          path: app/build/outputs/apk/sideload/staging/*.apk
          if-no-files-found: error
          retention-days: 14
