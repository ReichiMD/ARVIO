name: Test APK (Stalker catalog categories + TV preview)

# Test-branch only. This workflow and the committed keystore must never reach a
# pull request against upstream - they exist so a Claude Code session can hand
# the user an installable build. `workflow_dispatch` returns 403 from such a
# session (the app token has no `actions: write`), so a push to this branch is
# the trigger.

on:
  push:
    branches:
      - claude/vodgruppen-test-apk
  workflow_dispatch:

jobs:
  build-test-apk:
    name: Build sideload debug test APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      # Without a real key the app is an empty browser, and this round can only
      # be tested by playing an actual TMDB title through a Stalker portal.
      - name: Prepare runtime configuration
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: |
          cp secrets.defaults.properties secrets.properties
          if [ -n "$TMDB_API_KEY" ]; then
            sed -i "s|^TMDB_API_KEY=.*|TMDB_API_KEY=$TMDB_API_KEY|" secrets.properties
            echo "TMDB key injected"
          else
            echo "::error::TMDB_API_KEY secret is empty - this feature cannot be tested without it"
            exit 1
          fi

      # Sanity check: the TV preview must be in this build, and it must be the
      # kind that only fires when the user forces TV mode on a touch device.
      - name: Verify the TV preview patch is present
        run: |
          grep -q 'TvPreviewLetterbox' app/src/main/kotlin/com/arflix/tv/MainActivity.kt \
            || { echo "::error::TV preview letterbox missing"; exit 1; }
          grep -q 'deviceModeOverride == "tv" && hasTouchScreen' app/src/main/kotlin/com/arflix/tv/MainActivity.kt \
            || { echo "::error::TV preview guard missing or changed"; exit 1; }

      # The point of this round, checked before a build is spent on it. Asks for
      # all four parts separately - the portal fetch, the stored selection, the
      # sieve in front of the series binding cap, and the tab bar on both
      # surfaces. A build missing any one of them looks fine and tests nothing.
      - name: Verify the category-selection work is really in this build
        run: |
          grep -q 'fun getVodCategories' app/src/main/kotlin/com/arflix/tv/data/api/StalkerApi.kt \
            || { echo "::error::the portal category fetch is missing"; exit 1; }
          grep -q 'fun getSeriesCategories' app/src/main/kotlin/com/arflix/tv/data/api/StalkerApi.kt \
            || { echo "::error::the series category fetch is missing"; exit 1; }
          grep -q 'iptv_hidden_vod_categories' app/src/main/kotlin/com/arflix/tv/data/repository/IptvRepository.kt \
            || { echo "::error::the selection would not be stored"; exit 1; }
          grep -q 'iptv_hidden_series_categories' app/src/main/kotlin/com/arflix/tv/data/repository/IptvRepository.kt \
            || { echo "::error::the series selection would not be stored"; exit 1; }
          # Two call sites, one per catalog half: without both, one of them
          # silently keeps searching everything.
          test "$(grep -c 'filterStalkerCategorySelection(' app/src/main/kotlin/com/arflix/tv/data/repository/IptvRepository.kt)" = "3" \
            || { echo "::error::the sieve is not called from both lookup paths"; exit 1; }
          # The whole point of the setting: the sieve has to run BEFORE the
          # binding cap, or the cap has already spent its places.
          python3 - <<'PY'
          src = open("app/src/main/kotlin/com/arflix/tv/data/repository/IptvRepository.kt").read()
          start = src.index("private suspend fun findStalkerEpisodeVodSources")
          sieve = src.index("filterStalkerCategorySelection", start)
          cap = src.index("bindStalkerSeriesShows(shows, limit)", start)
          if sieve > cap:
              raise SystemExit("::error::the series sieve runs AFTER the binding cap - it would do nothing")
          print("series sieve runs before the binding cap")
          PY
          grep -q 'StalkerCategoryTabBar' app/src/main/kotlin/com/arflix/tv/ui/screens/settings/SettingsScreen.kt \
            || { echo "::error::the three-button bar is missing"; exit 1; }
          grep -q 'settings_iptv_tab_movies' app/src/main/res/values/strings.xml \
            || { echo "::error::the tab labels are missing"; exit 1; }
          # Both surfaces have to pass the tabs down, or one of them shows a bar
          # that never changes anything.
          test "$(grep -c 'showCategoryTabs = ' app/src/main/kotlin/com/arflix/tv/ui/screens/settings/SettingsScreen.kt)" = "2" \
            || { echo "::error::the tab bar is not wired on both the TV and the phone route"; exit 1; }
          # Live TV must not lose its reordering: the hold chip and the offset
          # helper both have to survive the rebuild.
          grep -q 'onToggleHold' app/src/main/kotlin/com/arflix/tv/ui/screens/settings/SettingsScreen.kt \
            || { echo "::error::live TV lost its hold-and-move chip"; exit 1; }
          # The categories must be fetched by the channel load, not by the
          # settings screen. A portal drops an idle connection after seconds,
          # so a request sent when the screen opens is the one that gets lost -
          # which is the bug this build exists to fix. Reading the settings
          # path is not enough: it looks identical either way.
          python3 - <<'PY'
          src = open("app/src/main/kotlin/com/arflix/tv/data/repository/IptvRepository.kt").read()
          start = src.index("private suspend fun fetchStalkerChannels")
          end = src.index("internal fun activeStalkerLiveTvPortals", start)
          body = src[start:end]
          for call in ("getVodCategories()", "getSeriesCategories()"):
              if call not in body:
                  raise SystemExit(
                      "::error::" + call + " is not fetched inside the channel "
                      "session - the settings screen would ask a cold portal again"
                  )
          reader = src.index("suspend fun stalkerCategories", 0)
          tail = src[reader:src.index("internal fun stalkerCategorySnapshotOf", reader)]
          for call in ("getVodCategories", "getSeriesCategories", "getOrCreateStalkerApi"):
              if call in tail:
                  raise SystemExit(
                      "::error::stalkerCategories still talks to the portal - "
                      "it must read the stored names only"
                  )
          print("categories are fetched in the channel session and read from disk")
          PY
          grep -q 'settings_iptv_catalog_not_loaded' app/src/main/res/values/strings.xml \
            || { echo "::error::the screen cannot tell 'not fetched yet' from 'no categories'"; exit 1; }
          # The phone catalog list has to be the live TV list: same card, same
          # hairline, same row. Without these it silently drifts back apart.
          grep -q 'private fun MobileStalkerCatalogRow' app/src/main/kotlin/com/arflix/tv/ui/screens/settings/SettingsScreen.kt \
            || { echo "::error::the phone catalog row is gone - the page looks unlike live TV again"; exit 1; }
          # Eleven German strings: without them an otherwise German app shows
          # "Movies", "Series" and "Searched" on this page.
          test "$(grep -c 'name="settings_iptv_catalog\|name="settings_iptv_tab' app/src/main/res/values-de/strings.xml)" = "11" \
            || { echo "::error::the German translation of the categories page is incomplete"; exit 1; }
          # A phone sub-page must swallow the taps its children did not take,
          # or they reach the settings list behind it and open the language picker.
          grep -q 'detectTapGestures { }' app/src/main/kotlin/com/arflix/tv/ui/screens/settings/SettingsScreen.kt \
            || { echo "::error::taps fall through a phone sub-page to the list behind it"; exit 1; }
          echo "category selection verified: fetch in the channel session, stored on disk, sieve before the cap, tab bar on both routes, live TV intact"

      - name: Compile and run unit tests
        run: |
          # A second run is the office rule for the known order-dependent flakes
          # (docs/34 5z): another ViewModel test can leave a coroutine on the Main
          # dispatcher. Nothing is silenced - the build still fails if it stays red.
          ./gradlew testSideloadDebugUnitTest --no-daemon \
            || ./gradlew testSideloadDebugUnitTest --no-daemon --rerun-tasks

      # The office wants the test count as a measured number, not a guess.
      # Gradle does not print one, so it is summed out of the JUnit XML.
      - name: Count the unit tests
        if: always()
        run: |
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          tests = failures = errors = skipped = 0
          for f in glob.glob("app/build/test-results/testSideloadDebugUnitTest/*.xml"):
              r = ET.parse(f).getroot()
              tests += int(r.get("tests", 0)); failures += int(r.get("failures", 0))
              errors += int(r.get("errors", 0)); skipped += int(r.get("skipped", 0))
          print(f"unit tests: {tests} | failures: {failures} | errors: {errors} | skipped: {skipped}")
          PY

      # The office rule is "detekt rule for rule unchanged", and the fork CI does
      # not run detekt at all - so the count is taken here. It never fails the
      # build: the comparison is the point, not a gate.
      - name: Count detekt findings rule by rule
        continue-on-error: true
        run: |
          ./gradlew detekt --no-daemon || true
          for report in app/build/reports/detekt/*.xml; do
            [ -f "$report" ] || continue
            echo "== $report"
            grep -o 'source="[^"]*"' "$report" | wc -l | sed 's/^/  findings: /'
            grep -o '<error[^>]*source="[^"]*"' "$report" \
              | sed -n 's/.*source="detekt\.\([^"]*\)".*/\1/p' | sort | uniq -c | sort -rn
          done

      - name: Give the debug build its own package, name and a fixed signature
        run: |
          # Kennung "vodgruppen" - the identifier of this theme (docs/10, AGENTS.md
          # rule 10). It steers all three places: package suffix, launcher name
          # and artifact name. It is a NEW identifier, so this build installs
          # BESIDE the other test APKs and starts empty: portal, MAC and
          # playlists have to be entered once.
          sed -i 's|<string name="app_name">ARVIO</string>|<string name="app_name">VOD-Gruppen</string>|' \
            app/src/main/res/values/strings.xml
          # debug differs from staging here: it has no applicationIdSuffix to
          # replace, only a commented-out line to take the place of (docs/10,
          # "Beim Wechsel der Sorte mitdenken").
          sed -i 's|// applicationIdSuffix = ".debug" // Disabled to preserve settings between debug/release|applicationIdSuffix = ".vodgruppen"|' \
            app/build.gradle.kts
          sed -i "s/versionCode = [0-9]*/versionCode = $((950000 + GITHUB_RUN_NUMBER))/" app/build.gradle.kts
          # A sed that silently matches nothing is how this kind of workflow wastes
          # a build cycle: a missed replacement fails nothing, it just ships an APK
          # under the plain package name and overwrites a different test build.
          grep -q '<string name="app_name">VOD-Gruppen</string>' app/src/main/res/values/strings.xml \
            || { echo "::error::app_name patch did not apply"; exit 1; }
          grep -q 'applicationIdSuffix = ".vodgruppen"' app/build.gradle.kts \
            || { echo "::error::suffix patch did not apply"; exit 1; }
          grep -q "versionCode = $((950000 + GITHUB_RUN_NUMBER))" app/build.gradle.kts \
            || { echo "::error::versionCode patch did not apply"; exit 1; }
          cat >> app/build.gradle.kts <<'KTS'

          // CI only: with no keystore of its own, the debug build type signs with
          // the signing config named "debug", which on a runner points at a
          // freshly generated ~/.android/debug.keystore - every build would carry
          // a different signature and no test APK could replace the previous one.
          // Pin it to the committed keystore.
          android {
              signingConfigs {
                  getByName("debug") {
                      storeFile = rootProject.file(".github/test-signing/debug.keystore")
                      storePassword = "android"
                      keyAlias = "androiddebugkey"
                      keyPassword = "android"
                  }
              }
          }
          KTS

      # Schnell-APK (docs/10, the standard). Every question this round asks is a
      # content question - does the portal's category list appear, does a
      # deselected group really drop out of the source list, do the live TV
      # groups still reorder - and none of them is about smoothness, which is
      # the only thing the slower Mess-APK answers better.
      - name: Build sideload debug APK
        run: ./gradlew assembleSideloadDebug --no-daemon

      - name: Verify APK signature against the committed keystore
        run: |
          EXPECTED=$(keytool -list -v -keystore .github/test-signing/debug.keystore \
            -storepass android | grep -i 'SHA256:' | head -1 | tr -d ' \t')
          # find, not ls: a filename with a space would break the glob (shellcheck SC2012).
          APK=$(find app/build/outputs/apk/sideload/debug -name '*.apk' -type f | head -1)
          ACTUAL=$(keytool -printcert -jarfile "$APK" -v | grep -i 'SHA256:' | head -1 | tr -d ' \t')
          echo "APK:      $APK"
          echo "expected: $EXPECTED"
          echo "actual:   $ACTUAL"
          if [ "$EXPECTED" != "$ACTUAL" ]; then
            echo "::error::Signature mismatch - Gradle did not use the committed keystore."
            exit 1
          fi
          echo "Signature verified against the committed keystore."

      # Proves the suffix really landed on the built artifact, not just in the
      # build file - the package name is what decides whether this installs
      # beside the other test APKs or over one of them.
      - name: Show the package name of the finished APK
        run: |
          AAPT=$(find "$ANDROID_HOME/build-tools" -name aapt2 -type f | sort | tail -1)
          APK=$(find app/build/outputs/apk/sideload/debug -name '*.apk' -type f | head -1)
          "$AAPT" dump packagename "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: arvio-vodgruppen-apk
          path: app/build/outputs/apk/sideload/debug/*.apk
          if-no-files-found: error
          retention-days: 14
