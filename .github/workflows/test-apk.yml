name: Test APK (Stalker protocol fixes)

# Test-branch only. This workflow and the committed keystore must never reach a
# pull request against upstream — they exist so a Claude Code session can hand
# the user an installable build. `workflow_dispatch` returns 403 from such a
# session (the app token has no `actions: write`), so a push to this branch is
# the trigger.

on:
  push:
    branches:
      - claude/stalker-protokoll-test-apk
  workflow_dispatch:

jobs:
  build-test-apk:
    name: Build sideload debug test APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      # This build is judged against the user's own IPTV portals, so TMDB is not
      # what it stands or falls on — a missing key only empties the non-live
      # rows and must not fail the build.
      - name: Prepare runtime configuration
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: |
          cp secrets.defaults.properties secrets.properties
          if [ -n "$TMDB_API_KEY" ]; then
            sed -i "s|^TMDB_API_KEY=.*|TMDB_API_KEY=$TMDB_API_KEY|" secrets.properties
            echo "TMDB key injected"
          else
            echo "::warning::TMDB_API_KEY secret is empty - the test app will show no TMDB content"
          fi

      - name: Compile and run unit tests
        run: ./gradlew testSideloadDebugUnitTest --no-daemon

      # docs/10 "DER TEST-APK-STANDARD": this is a SCHNELL-APK
      # (`assembleSideloadDebug`). The test question is how often the channel
      # list is downloaded and whether a portal that failed is asked again —
      # logic and network traffic, not smoothness. A staging build with R8 would
      # cost ten more minutes and answer nothing extra.
      #
      # Kennung `senderliste`: it drives the package suffix, the launcher name
      # and the artifact name together, so this build cannot overwrite the
      # `vodsuche` or `zap` test apps on the same device. The price is that it
      # installs as a separate app and starts empty — portal and MAC have to be
      # entered once.
      - name: Give the debug build its own package, name and a fixed signature
        run: |
          # In the debug block the suffix line is commented out, so this inserts
          # rather than replaces.
          sed -i 's|// applicationIdSuffix = ".debug".*|applicationIdSuffix = ".senderliste"|' app/build.gradle.kts
          sed -i 's/versionNameSuffix = "-debug"/versionNameSuffix = "-senderliste"/' app/build.gradle.kts
          sed -i "s/versionCode = [0-9]*/versionCode = $((960200 + GITHUB_RUN_NUMBER))/" app/build.gradle.kts
          sed -i 's|<string name="app_name">ARVIO</string>|<string name="app_name">Senderliste</string>|' \
            app/src/main/res/values/strings.xml
          # Every edit above is checked. A sed that silently matches nothing is
          # how this kind of workflow wastes a build cycle (docs/12 learned it
          # the hard way).
          grep -q 'applicationIdSuffix = ".senderliste"' app/build.gradle.kts || { echo "::error::suffix patch did not apply"; exit 1; }
          grep -q 'versionNameSuffix = "-senderliste"' app/build.gradle.kts || { echo "::error::versionName patch did not apply"; exit 1; }
          grep -q "versionCode = $((960200 + GITHUB_RUN_NUMBER))" app/build.gradle.kts || { echo "::error::versionCode patch did not apply"; exit 1; }
          grep -q '>Senderliste<' app/src/main/res/values/strings.xml || { echo "::error::app_name patch did not apply"; exit 1; }
          cat >> app/build.gradle.kts <<'KTS'

          // CI only: the debug build type uses the signing config named "debug".
          // On a runner that config points at a freshly generated
          // ~/.android/debug.keystore, so every build would carry a different
          // signature and testers could not install one test APK over the
          // previous one. Pin it to the committed keystore instead.
          android {
              signingConfigs {
                  getByName("debug") {
                      storeFile = rootProject.file(".github/test-signing/debug.keystore")
                      storePassword = "android"
                      keyAlias = "androiddebugkey"
                      keyPassword = "android"
                  }
              }
          }
          KTS

      - name: Build sideload debug APK
        run: ./gradlew assembleSideloadDebug --no-daemon

      - name: Verify APK signature against the committed keystore
        run: |
          EXPECTED=$(keytool -list -v -keystore .github/test-signing/debug.keystore \
            -storepass android | grep -i 'SHA256:' | head -1 | tr -d ' \t')
          APK=$(find app/build/outputs/apk/sideload/debug -name "*.apk" | head -1)
          ACTUAL=$(keytool -printcert -jarfile "$APK" -v | grep -i 'SHA256:' | head -1 | tr -d ' \t')
          echo "APK:      $APK"
          echo "expected: $EXPECTED"
          echo "actual:   $ACTUAL"
          if [ "$EXPECTED" != "$ACTUAL" ]; then
            echo "::error::Signature mismatch - Gradle did not use the committed keystore."
            exit 1
          fi
          echo "Signature verified against the committed keystore."

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: arvio-senderliste-apk
          path: app/build/outputs/apk/sideload/debug/*.apk
          if-no-files-found: error
          retention-days: 14
