name: Verify i18n PR2

on:
  push:
    branches:
      - test/i18n-pr2-verify

jobs:
  verify:
    name: Compile and unit tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Prepare placeholder build configuration
        run: cp secrets.defaults.properties secrets.properties

      - name: Compile and test
        run: ./gradlew testSideloadDebugUnitTest --no-daemon
